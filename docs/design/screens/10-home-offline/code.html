<script>
  // Simple micro-interaction for connection button feedback
  document.getElementById('go-online-btn')?.addEventListener('click', function() {
    const textNode = this.querySelector('span:nth-child(2)');
    const indicator = this.querySelector('span:first-child');
    if (textNode) {
      textNode.textContent = 'جاري الاتصال...';
      indicator.classList.remove('bg-primary-fixed-dim');
      indicator.classList.add('bg-surface-variant', 'animate-pulse');
      setTimeout(() => {
        textNode.textContent = 'أنت متصل الآن';
        indicator.classList.remove('bg-surface-variant', 'animate-pulse');
        indicator.classList.add('bg-primary-fixed');
      }, 1200);
    }
  });
