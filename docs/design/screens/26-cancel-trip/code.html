  </head><body class="bg-surface font-body-md text-on-surface flex flex-col antialiased selection:bg-secondary-fixed"><header class="fixed top-0 inset-x-0 z-50 bg-surface-container-lowest/90 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="رجوع" class="w-11 h-11 min-w-[44px] min-h-[44px] flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high transition-colors active:scale-95" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h1 class="text-headline-sm font-headline-sm text-on-surface select-none">Trip Cancel Reason</h1></div><div class="w-11 h-11 flex items-center justify-center"><span class="w-2 h-2 rounded-full bg-secondary-container"></span></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-8">
<div class="px-margin pt-space-md flex flex-col gap-space-lg">
<div class="flex items-center justify-between bg-surface-container-low px-space-md py-space-sm rounded-xl">
<div class="flex items-center gap-space-sm">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">directions_car</span>
<span class="font-label-md text-label-md text-on-surface">رحلة عينكاوة - شارع 100</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container px-space-sm py-0.5 rounded-full">#8492</span>
</div>
<div class="flex flex-col gap-space-xs">
<h2 class="font-headline-lg text-headline-lg text-on-surface">ليش بدك تلغي؟</h2>
<p class="font-body-md text-body-md text-on-surface-variant">حدد السبب الفعلي ليتم توثيق الحالة بصورة نظامية وبدقة.</p>
</div>
<form class="flex flex-col gap-space-sm" id="cancelReasonForm" onsubmit="event.preventDefault();">
<label class="group relative flex items-center justify-between min-h-[56px] px-space-md rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all active:scale-[0.99] hover:bg-surface-container-low">
<div class="flex items-center gap-space-md">
<span class="w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors group-hover:bg-surface-container-high">
<span class="w-2.5 h-2.5 rounded-full bg-transparent transition-all dot-indicator"></span>
</span>
<span class="font-label-lg text-label-lg text-on-surface">الراكب طلب الإلغاء</span>
</div>
<input class="sr-only" name="cancel_reason" onchange="toggleOtherInput(false)" type="radio" value="passenger_requested"/>
</label>
<label class="group relative flex items-center justify-between min-h-[56px] px-space-md rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all active:scale-[0.99] hover:bg-surface-container-low">
<div class="flex items-center gap-space-md">
<span class="w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors group-hover:bg-surface-container-high">
<span class="w-2.5 h-2.5 rounded-full bg-transparent transition-all dot-indicator"></span>
</span>
<span class="font-label-lg text-label-lg text-on-surface">العنوان غير صحيح</span>
</div>
<input class="sr-only" name="cancel_reason" onchange="toggleOtherInput(false)" type="radio" value="wrong_address"/>
</label>
<label class="group relative flex items-center justify-between min-h-[56px] px-space-md rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all active:scale-[0.99] hover:bg-surface-container-low">
<div class="flex items-center gap-space-md">
<span class="w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors group-hover:bg-surface-container-high">
<span class="w-2.5 h-2.5 rounded-full bg-transparent transition-all dot-indicator"></span>
</span>
<span class="font-label-lg text-label-lg text-on-surface">مشكلة في السيارة</span>
</div>
<input class="sr-only" name="cancel_reason" onchange="toggleOtherInput(false)" type="radio" value="vehicle_issue"/>
</label>
<label class="group relative flex items-center justify-between min-h-[56px] px-space-md rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all active:scale-[0.99] hover:bg-surface-container-low">
<div class="flex items-center gap-space-md">
<span class="w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors group-hover:bg-surface-container-high">
<span class="w-2.5 h-2.5 rounded-full bg-transparent transition-all dot-indicator"></span>
</span>
<span class="font-label-lg text-label-lg text-on-surface">حالة طارئة</span>
</div>
<input class="sr-only" name="cancel_reason" onchange="toggleOtherInput(false)" type="radio" value="emergency"/>
</label>
<div class="flex flex-col rounded-xl bg-surface-container-lowest shadow-sm overflow-hidden transition-all duration-200" id="otherReasonContainer">
<label class="group relative flex items-center justify-between min-h-[56px] px-space-md cursor-pointer transition-colors hover:bg-surface-container-low">
<div class="flex items-center gap-space-md">
<span class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary transition-colors" id="otherRadioOuter">
<span class="w-2.5 h-2.5 rounded-full bg-on-primary scale-100 transition-all" id="otherRadioInner"></span>
</span>
<span class="font-label-lg text-label-lg text-on-surface font-semibold">سبب آخر</span>
</div>
<input checked="" class="sr-only" name="cancel_reason" onchange="toggleOtherInput(true)" type="radio" value="other"/>
</label>
<div class="px-space-md pb-space-md flex flex-col gap-space-xs transition-all" id="expandedTextInputWrapper">
<textarea class="w-full bg-surface-container-low text-on-surface placeholder:text-outline p-space-md rounded-xl font-body-md text-body-md resize-none outline-none focus:bg-surface-container transition-colors" id="detailedReasonInput" placeholder="اكتب السبب بالتفصيل..." rows="3"></textarea>
<div class="flex justify-between items-center text-on-surface-variant px-space-xs">
<span class="font-label-sm text-label-sm">الحد الأدنى 10 أحرف</span>
<span class="font-label-sm text-label-sm">0/150</span>
</div>
</div>
</div>
</form>
<div class="flex items-start gap-space-md p-space-md rounded-xl bg-error-container text-on-error-container shadow-sm">
<div class="w-10 h-10 min-w-[40px] min-h-[40px] rounded-full bg-error flex items-center justify-center text-on-error shadow-sm mt-0.5">
<span class="material-symbols-outlined text-[22px]">warning</span>
</div>
<div class="flex flex-col gap-1 min-w-0">
<span class="font-label-lg text-label-lg text-error font-bold leading-tight">تنبيه لمعدل القبول</span>
<p class="font-body-md text-body-md text-on-error-container leading-relaxed">
          الإلغاء يُحسب في نسبة الإلغاء التي تشترطها بعض المكافآت الأسبوعية وساعات الذروة.
        </p>
</div>
</div>
<div class="flex flex-col gap-space-sm pt-space-xs">
<button class="w-full min-h-[56px] h-14 rounded-xl bg-error text-on-error font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-md active:scale-[0.98] transition-all hover:brightness-95" id="confirmCancelBtn" onclick="handleCancellation()" type="button">
<span class="material-symbols-outlined text-[20px]">cancel</span>
<span>إلغاء الرحلة</span>
</button>
<button class="w-full min-h-[56px] h-14 rounded-xl bg-surface-container-lowest text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-sm active:scale-[0.98] transition-all hover:bg-surface-container-low" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
<span>الرجوع للرحلة</span>
</button>
</div>
</div>
</div>
<script>
  function toggleOtherInput(isOther) {
    const textWrapper = document.getElementById('expandedTextInputWrapper');
    const otherOuter = document.getElementById('otherRadioOuter');
    const otherInner = document.getElementById('otherRadioInner');
    const radioLabels = document.querySelectorAll('#cancelReasonForm label');

    radioLabels.forEach(label => {
      const dot = label.querySelector('.dot-indicator');
      const outer = label.querySelector('span:first-child');
      const radio = label.querySelector('input[type="radio"]');
      
      if (radio && radio.value !== 'other') {
        if (radio.checked) {
          outer.classList.remove('bg-surface-container');
          outer.classList.add('bg-primary');
          dot.classList.remove('bg-transparent');
          dot.classList.add('bg-on-primary');
        } else {
          outer.classList.add('bg-surface-container');
          outer.classList.remove('bg-primary');
          dot.classList.add('bg-transparent');
          dot.classList.remove('bg-on-primary');
        }
      }
    });

    if (isOther) {
      textWrapper.classList.remove('hidden');
      otherOuter.classList.add('bg-primary');
      otherOuter.classList.remove('bg-surface-container');
      otherInner.classList.add('bg-on-primary');
      otherInner.classList.remove('bg-transparent');
    } else {
      textWrapper.classList.add('hidden');
      otherOuter.classList.remove('bg-primary');
      otherOuter.classList.add('bg-surface-container');
      otherInner.classList.remove('bg-on-primary');
      otherInner.classList.add('bg-transparent');
    }
  }

  function handleCancellation() {
    const btn = document.getElementById('confirmCancelBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>جاري الإلغاء...</span>';
    setTimeout(() => {
      history.back();
    }, 700);
  }
</script></main></body></html>
