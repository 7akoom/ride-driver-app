<!DOCTYPE html>

<html dir="rtl" lang="ar"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary-fixed-dim":"#e9c179","tertiary":"#004cca","inverse-on-surface":"#eff0fd","surface-variant":"#e1e2ee","surface-tint":"#78591c","on-secondary-container":"#786131","tertiary-fixed":"#dbe1ff","on-tertiary-fixed":"#00174b","inverse-primary":"#e9c179","background":"#faf8ff","primary-container":"#8a6a2b","secondary-fixed":"#fddfa3","outline":"#807667","error":"#ba1a1a","surface-container-highest":"#e1e2ee","surface-container-low":"#f2f3ff","outline-variant":"#d1c5b4","on-primary-fixed":"#271900","tertiary-fixed-dim":"#b4c5ff","on-secondary":"#ffffff","on-primary-fixed-variant":"#5d4203","on-primary-container":"#fff2e0","surface-container-lowest":"#ffffff","primary":"#6f5214","primary-fixed":"#ffdea7","on-surface":"#191b24","on-tertiary-fixed-variant":"#003ea8","on-tertiary-container":"#f2f2ff","secondary-container":"#fddfa3","surface-dim":"#d8d9e6","surface-container":"#ecedfa","on-surface-variant":"#4e4639","on-tertiary":"#ffffff","on-background":"#191b24","on-error-container":"#93000a","tertiary-container":"#2865ed","on-primary":"#ffffff","surface-container-high":"#e6e7f4","surface":"#faf8ff","on-secondary-fixed-variant":"#584416","secondary-fixed-dim":"#e0c389","secondary":"#715b2c","on-error":"#ffffff","error-container":"#ffdad6","surface-bright":"#faf8ff","on-secondary-fixed":"#261a00","inverse-surface":"#2e303a"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{gutter:"1rem","space-lg":"1.5rem","space-xl":"2rem","space-md":"1rem","space-sm":"0.5rem",margin:"1rem","space-xs":"0.25rem"},fontFamily:{"headline-md":["IBM Plex Sans"],"headline-xl":["IBM Plex Sans"],"body-lg":["IBM Plex Sans"],"headline-sm":["IBM Plex Sans"],"body-md":["IBM Plex Sans"],"label-lg":["IBM Plex Sans"],"label-md":["IBM Plex Sans"],"body-sm":["IBM Plex Sans"],"numeric-fare":["IBM Plex Sans"],"label-sm":["IBM Plex Sans"],"headline-lg":["IBM Plex Sans"]},fontSize:{"headline-md":["20px",{lineHeight:"30px",fontWeight:"600"}],"headline-xl":["32px",{lineHeight:"44px",fontWeight:"700"}],"body-lg":["16px",{lineHeight:"26px",fontWeight:"400"}],"headline-sm":["18px",{lineHeight:"26px",fontWeight:"600"}],"body-md":["14px",{lineHeight:"22px",fontWeight:"400"}],"label-lg":["16px",{lineHeight:"24px",fontWeight:"600"}],"label-md":["14px",{lineHeight:"20px",fontWeight:"500"}],"body-sm":["13px",{lineHeight:"20px",fontWeight:"400"}],"numeric-fare":["28px",{lineHeight:"36px",fontWeight:"700"}],"label-sm":["12px",{lineHeight:"18px",fontWeight:"500"}],"headline-lg":["26px",{lineHeight:"36px",fontWeight:"700"}]}}}};</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;font-family:"IBM Plex Sans",sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full relative select-none overflow-hidden" dir="rtl">
<!-- Dynamic Dark Calling Viewport Container -->
<div class="relative w-full rounded-xl bg-inverse-surface text-inverse-on-surface flex flex-col justify-between items-center py-space-xl px-gutter shadow-xl min-h-[720px] transition-colors duration-500">
<!-- Ambient Soundwave Glow Backdrop -->
<div class="absolute inset-0 overflow-hidden pointer-events-none rounded-xl">
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 rounded-full bg-primary-container/15 blur-3xl"></div>
<div class="absolute bottom-1/4 left-1/2 -translate-x-1/2 w-72 h-72 rounded-full bg-tertiary-container/10 blur-3xl"></div>
</div>
<!-- Top App & Security Banner -->
<div class="relative z-10 w-full flex flex-col items-center gap-space-xs mt-space-sm">
<div class="inline-flex items-center gap-space-xs px-space-md py-1.5 rounded-full bg-surface-container-highest/20 backdrop-blur-md">
<span class="material-symbols-outlined text-primary-fixed-dim text-body-lg" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm text-surface-variant font-medium">مكالمة آمنة ومحمية عبر التطبيق</span>
</div>
<!-- Masked Number Privacy Pill Badge -->
<div class="inline-flex items-center gap-1.5 px-space-md py-1 rounded-full bg-surface-variant/10 mt-space-xs max-w-xs text-center">
<span class="material-symbols-outlined text-outline-variant text-body-sm">shield_person</span>
<span class="font-body-sm text-body-sm text-surface-container-high leading-tight">رقمك مخفي عن الراكب ورقمه مخفي عنك</span>
</div>
</div>
<!-- Center Contact Profile & Animated Calling Rings -->
<div class="relative z-10 flex flex-col items-center justify-center my-auto py-space-lg">
<!-- Pulsing Rings Wrapper -->
<div class="relative flex items-center justify-center w-52 h-52 mb-space-md">
<!-- Ripple Ring 3 -->
<div class="absolute inset-0 rounded-full bg-primary-container/10 animate-ping opacity-30" id="ripple-3" style="animation-duration: 3s; animation-iteration-count: infinite;"></div>
<!-- Ripple Ring 2 -->
<div class="absolute w-44 h-44 rounded-full bg-primary-container/20 animate-pulse" id="ripple-2" style="animation-duration: 2s; animation-iteration-count: infinite;"></div>
<!-- Ripple Ring 1 (Inner Glow) -->
<div class="absolute w-36 h-36 rounded-full bg-primary/30 blur-sm"></div>
<!-- Rider Initial Avatar Disc -->
<div class="relative z-20 w-32 h-32 rounded-full bg-primary-container flex items-center justify-center shadow-2xl">
<span class="font-headline-xl text-headline-xl text-on-primary-container tracking-wider font-bold select-none">أ</span>
</div>
</div>
<!-- Rider Identity Text Hierarchy -->
<div class="flex flex-col items-center text-center gap-1">
<h1 class="font-headline-xl text-headline-xl font-bold text-surface-bright tracking-tight">أحمد</h1>
<p class="font-body-md text-body-md text-surface-container-highest/80">الراكب في وجهة المنصور</p>
</div>
<!-- Live Connection State with Animated Indicator -->
<div class="mt-space-md flex items-center gap-2 px-space-md py-1.5 rounded-full bg-surface-container-highest/15">
<span class="relative flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-fixed-dim opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-primary-fixed-dim"></span>
</span>
<span class="font-label-md text-label-md text-primary-fixed font-medium" id="call-status-label">جاري الاتصال…</span>
</div>
<!-- Call Timer (Western digits, switches smoothly once connected) -->
<div class="mt-space-xs opacity-75" id="call-timer-box">
<span class="font-numeric-fare text-numeric-fare text-surface-container-high tracking-widest text-sm" id="call-timer">--:--</span>
</div>
</div>
<!-- Contextual Trip Tag -->
<div class="relative z-10 w-full max-w-xs mb-space-lg px-space-md py-space-sm rounded-xl bg-surface-variant/10 flex items-center justify-between">
<div class="flex items-center gap-2 min-w-0">
<span class="material-symbols-outlined text-primary-fixed-dim text-headline-sm">local_taxi</span>
<div class="flex flex-col truncate">
<span class="font-label-sm text-label-sm text-surface-variant">طلب الرحلة الحالي</span>
<span class="font-body-sm text-body-sm text-surface-bright truncate font-semibold">بوابة 4 • معرض بغداد</span>
</div>
</div>
<span class="font-label-sm text-label-sm text-primary-fixed-dim px-2 py-0.5 rounded-full bg-primary-container/30">د.ع 6,500</span>
</div>
<!-- Bottom Ergonomic Action Panel -->
<div class="relative z-10 w-full max-w-sm flex flex-col gap-space-lg pb-space-sm">
<!-- Interactive Calling Control Trigger Array -->
<div class="flex items-center justify-around w-full px-space-xs">
<!-- Speaker Toggle Button -->
<div class="flex flex-col items-center gap-2">
<button aria-pressed="false" class="w-16 h-16 rounded-full bg-surface-variant/15 text-surface-bright flex items-center justify-center active:scale-95 transition-all duration-200 hover:bg-surface-variant/25 shadow-md" id="btn-speaker" type="button">
<span class="material-symbols-outlined text-headline-md" id="icon-speaker">volume_up</span>
</button>
<span class="font-label-sm text-label-sm text-surface-variant">مكبر الصوت</span>
</div>
<!-- End Call (Prominent Hanging Anchor Pill) -->
<div class="flex flex-col items-center gap-2">
<button class="w-20 h-20 rounded-full bg-error text-on-error flex items-center justify-center shadow-2xl active:scale-90 transition-transform duration-200 hover:opacity-90" id="btn-hangup" type="button">
<span class="material-symbols-outlined text-headline-lg font-bold" style="transform: rotate(135deg);">call</span>
</button>
<span class="font-label-md text-label-md text-error-container font-semibold">إنهاء</span>
</div>
<!-- Mute Microphone Toggle Button -->
<div class="flex flex-col items-center gap-2">
<button aria-pressed="false" class="w-16 h-16 rounded-full bg-surface-variant/15 text-surface-bright flex items-center justify-center active:scale-95 transition-all duration-200 hover:bg-surface-variant/25 shadow-md" id="btn-mute" type="button">
<span class="material-symbols-outlined text-headline-md" id="icon-mute">mic</span>
</button>
<span class="font-label-sm text-label-sm text-surface-variant" id="label-mute">كتم الصوت</span>
</div>
</div>
<!-- Quick Message Shortcut Pill (In-App VoIP Enhancement) -->
<button class="w-full h-12 rounded-xl bg-surface-variant/10 hover:bg-surface-variant/15 active:bg-surface-variant/20 text-surface-container-high font-label-md text-label-md flex items-center justify-center gap-2 transition-colors" id="btn-quick-msg" type="button">
<span class="material-symbols-outlined text-body-lg text-primary-fixed-dim">chat_bubble</span>
<span>إرسال رسالة جاهزة: "أنا عند نقطة الانطلاق"</span>
</button>
</div>
</div>
<script>
    (function initCallingScreen() {
      const statusLabel = document.getElementById('call-status-label');
      const timerEl = document.getElementById('call-timer');
      const btnSpeaker = document.getElementById('btn-speaker');
      const iconSpeaker = document.getElementById('icon-speaker');
      const btnMute = document.getElementById('btn-mute');
      const iconMute = document.getElementById('icon-mute');
      const labelMute = document.getElementById('label-mute');
      const btnHangup = document.getElementById('btn-hangup');
      const btnQuickMsg = document.getElementById('btn-quick-msg');

      let secondsElapsed = 0;
      let timerInterval = null;
      let isConnected = false;
      let isSpeakerOn = false;
      let isMuted = false;

      // Simulated VoIP pick-up sequence after 3.8s for maximum delight & realism
      const connectTimeout = setTimeout(() => {
        isConnected = true;
        if (statusLabel) {
          statusLabel.textContent = "متصل";
          statusLabel.className = "font-label-md text-label-md text-surface-bright font-medium";
        }
        
        timerInterval = setInterval(() => {
          secondsElapsed++;
          const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
          const secs = String(secondsElapsed % 60).padStart(2, '0');
          if (timerEl) {
            timerEl.textContent = mins + ":" + secs;
          }
        }, 1000);
      }, 3800);

      // Speaker Toggle
      if (btnSpeaker) {
        btnSpeaker.addEventListener('click', () => {
          isSpeakerOn = !isSpeakerOn;
          btnSpeaker.setAttribute('aria-pressed', String(isSpeakerOn));
          if (isSpeakerOn) {
            btnSpeaker.classList.remove('bg-surface-variant/15', 'text-surface-bright');
            btnSpeaker.classList.add('bg-primary-container', 'text-on-primary-container');
            if (iconSpeaker) iconSpeaker.textContent = 'volume_up';
          } else {
            btnSpeaker.classList.remove('bg-primary-container', 'text-on-primary-container');
            btnSpeaker.classList.add('bg-surface-variant/15', 'text-surface-bright');
            if (iconSpeaker) iconSpeaker.textContent = 'volume_down';
          }
        });
      }

      // Mute Toggle
      if (btnMute) {
        btnMute.addEventListener('click', () => {
          isMuted = !isMuted;
          btnMute.setAttribute('aria-pressed', String(isMuted));
          if (isMuted) {
            btnMute.classList.remove('bg-surface-variant/15', 'text-surface-bright');
            btnMute.classList.add('bg-surface-variant/40', 'text-error-container');
            if (iconMute) iconMute.textContent = 'mic_off';
            if (labelMute) labelMute.textContent = 'تم الكتم';
          } else {
            btnMute.classList.remove('bg-surface-variant/40', 'text-error-container');
            btnMute.classList.add('bg-surface-variant/15', 'text-surface-bright');
            if (iconMute) iconMute.textContent = 'mic';
            if (labelMute) labelMute.textContent = 'كتم الصوت';
          }
        });
      }

      // Hangup Sequence
      if (btnHangup) {
        btnHangup.addEventListener('click', () => {
          clearTimeout(connectTimeout);
          if (timerInterval) clearInterval(timerInterval);
          if (statusLabel) {
            statusLabel.textContent = "تم إنهاء المكالمة";
            statusLabel.className = "font-label-md text-label-md text-error-container font-medium";
          }
          btnHangup.disabled = true;
          btnHangup.classList.add('opacity-50');
          setTimeout(() => {
            if (window.history && window.history.length > 1) {
              window.history.back();
            }
          }, 800);
        });
      }

      // Quick Message notification mock
      if (btnQuickMsg) {
        btnQuickMsg.addEventListener('click', () => {
          const originalText = btnQuickMsg.innerHTML;
          btnQuickMsg.innerHTML = '<span class="material-symbols-outlined text-body-lg text-primary-fixed-dim">check</span><span>تم إرسال الإشعار للراكب</span>';
          setTimeout(() => {
            btnQuickMsg.innerHTML = originalText;
          }, 2400);
        });
      }
    })();
  </script>
</div></main></body></html>
