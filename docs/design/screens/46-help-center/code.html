<div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-outline">

</div>

</div>
<span class="font-label-sm text-label-sm bg-surface-container-lowest text-primary px-2.5 py-0.5 rounded-full shadow-xs">مكتملة</span>

<div class="flex items-start gap-2.5 min-w-0">
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center shrink-0 text-primary">
<span class="material-symbols-outlined text-[20px]">local_taxi</span>
</div>
<div class="min-w-0 flex flex-col">
<p class="font-label-md text-label-md text-on-surface font-medium truncate">شارع 60 إلى مطار أربيل الدولي</p>
<p class="font-body-sm text-body-sm text-outline mt-0.5">اليوم 14:20</p>
</div>
</div>
<div class="text-left shrink-0">
<span class="font-numeric-fare text-headline-sm text-primary font-bold">5,600</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium"> د.ع</span>
</div>
</div>
</div>

<span class="material-symbols-outlined text-[18px] text-primary">receipt_long</span>

</div>
</div>

</button>

<div class="w-10 h-10 rounded-lg bg-surface-container-lowest flex items-center justify-center text-primary mb-3 shadow-xs group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-[22px]">badge</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface font-semibold">الوثائق والحساب</span>
<span class="font-body-sm text-body-sm text-outline mt-1 line-clamp-2">تجديد الإجازة، السنوية، والملف الشخصي</span>
</button>

<div class="w-10 h-10 rounded-lg bg-surface-container-lowest flex items-center justify-center text-primary mb-3 shadow-xs group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-[22px]">directions_car</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface font-semibold">السيارة</span>
<span class="font-body-sm text-body-sm text-outline mt-1 line-clamp-2">إضافة مركبة، تبديل السيارة، والمتطلبات</span>
</button>
<!-- 5. Safety -->
<button class="flex flex-col items-start p-3.5 rounded-xl bg-surface-container-low hover:bg-surface-container transition-all text-right active:scale-[0.98] group" type="button">
<div class="w-10 h-10 rounded-lg bg-surface-container-lowest flex items-center justify-center text-primary mb-3 shadow-xs group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">

<span class="font-label-lg text-label-lg text-on-surface font-semibold">الأمان</span>

</button>
<!-- 6. Lost Items -->

<div class="w-10 h-10 rounded-lg bg-surface-container-lowest flex items-center justify-center text-primary mb-3 shadow-xs group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-[22px]">find_in_page</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface font-semibold">المفقودات</span>

</div>

<div class="flex flex-col space-y-3 pt-2">
<h2 class="font-headline-sm text-headline-sm text-on-surface font-semibold">الدعم المباشر</h2>

</div>
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-2">
<span class="font-label-lg text-label-lg text-on-surface font-semibold">تذاكري</span>
<span class="font-label-sm text-label-sm bg-primary-fixed text-on-primary-fixed px-2 py-0.5 rounded-full font-medium">1 مفتوحة</span>
</div>

</div>
</div>
<div class="shrink-0 mr-2 text-outline">
<span class="material-symbols-outlined text-[22px]">chevron_left</span>
</div>
</div>
<!-- Create Ticket Action Button -->
<button class="w-full h-14 rounded-xl bg-inverse-surface text-inverse-on-surface flex items-center justify-center gap-2 font-label-lg text-label-lg shadow-sm hover:opacity-95 active:scale-[0.99] transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
