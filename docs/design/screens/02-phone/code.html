</button>
<!-- Driver Friendly Keypad Container (Always LTR geometry for numbers) -->

<div class="grid grid-cols-3 gap-2">
<!-- 1 -->

<!-- 4 -->
<button class="key-btn h-14 rounded-lg bg-surface-container-lowest text-on-surface flex flex-col items-center justify-center shadow-sm active:bg-secondary-fixed active:text-on-secondary-fixed active:scale-95 transition-all" type="button">

<!-- 5 -->

<span class="font-label-sm text-label-sm text-on-surface-variant/60 leading-none mt-0.5">PQRS</span>

<span class="font-headline-md text-headline-md leading-none font-bold">8</span>

<script>
  (() => {
    let rawDigits = "750";
    let isTermsAccepted = true;

    const displayEl = document.getElementById("phoneDisplay");
    const placeholderEl = document.getElementById("phonePlaceholder");
    const cursorEl = document.getElementById("typingCursor");
    const submitBtn = document.getElementById("submitBtn");
    const termsCheckbox = document.getElementById("termsCheckbox");
    const termsRow = document.getElementById("termsRow");
    const backspaceBtn = document.getElementById("backspaceBtn");
    const quickFillBtn = document.getElementById("quickFillBtn");

    function formatNumber(digits) {
      if (!digits) return "";
      let formatted = "";
      if (digits.length <= 3) {
        formatted = digits;
      } else if (digits.length <= 6) {
        formatted = digits.slice(0, 3) + " " + digits.slice(3);
      } else {
        formatted = digits.slice(0, 3) + " " + digits.slice(3, 6) + " " + digits.slice(6, 10);
      }
      return formatted;
    }

    function render() {
      if (rawDigits.length === 0) {
        displayEl.textContent = "";
        placeholderEl.classList.remove("hidden");
        cursorEl.classList.remove("hidden");
      } else {
        placeholderEl.classList.add("hidden");
        cursorEl.classList.remove("hidden");
        displayEl.textContent = formatNumber(rawDigits);
      }

      // Check validity (Iraqi numbers usually 10 digits starting with 7)
      const isValid = rawDigits.length === 10 && isTermsAccepted;
      if (isValid) {
        submitBtn.classList.remove("bg-secondary-fixed", "text-on-secondary-fixed", "opacity-80");
        submitBtn.classList.add("bg-primary", "text-on-primary", "shadow-lg");
      } else {
        submitBtn.classList.add("bg-secondary-fixed", "text-on-secondary-fixed");
        submitBtn.classList.remove("bg-primary", "text-on-primary", "shadow-lg");
      }
    }

    // Number Keypad Inputs
    document.querySelectorAll(".key-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const num = btn.querySelector("span").textContent.trim();
        if (rawDigits.length < 10) {
          rawDigits += num;
          render();
        }
      });
    });

    // Backspace
    backspaceBtn.addEventListener("click", () => {
      if (rawDigits.length > 0) {
        rawDigits = rawDigits.slice(0, -1);
        render();
      }
    });

    // Quick Fill shortcut for delight & prototyping
    quickFillBtn.addEventListener("click", () => {
      rawDigits = "7504289311";
      render();
    });

    // Toggle Terms checkbox
    termsRow.addEventListener("click", () => {
      isTermsAccepted = !isTermsAccepted;
      if (isTermsAccepted) {
        termsCheckbox.classList.remove("bg-surface-container-high", "text-transparent");
        termsCheckbox.classList.add("bg-secondary-fixed", "text-on-secondary-fixed");
      } else {
        termsCheckbox.classList.remove("bg-secondary-fixed", "text-on-secondary-fixed");
        termsCheckbox.classList.add("bg-surface-container-high", "text-transparent");
      }
      render();
    });

    // Initial render
    render();
  })();
</script></main><div class="fixed bottom-0 inset-x-0 z-40 pb-2 pointer-events-none flex justify-center"><div class="w-32 h-1 bg-on-surface/20 rounded-full"></div></div></body></html>
