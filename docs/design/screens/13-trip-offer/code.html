<!DOCTYPE html>

<html dir="rtl" lang="ar"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed-dim": "#b4c5ff", "inverse-surface": "#2e303a", "tertiary-fixed": "#dbe1ff", "surface-container-lowest": "#ffffff", "on-secondary-container": "#786131", "on-primary": "#ffffff", "on-tertiary-fixed-variant": "#003ea8", "surface-container-low": "#f2f3ff", "error-container": "#ffdad6", "on-tertiary": "#ffffff", "on-surface-variant": "#4e4639", "primary-fixed-dim": "#e9c179", "on-error-container": "#93000a", "surface-dim": "#d8d9e6", "on-tertiary-container": "#f2f2ff", "tertiary": "#004cca", "error": "#ba1a1a", "inverse-primary": "#e9c179", "primary-container": "#8a6a2b", "secondary": "#715b2c", "on-secondary": "#ffffff", "surface-container": "#ecedfa", "outline": "#807667", "tertiary-container": "#2865ed", "on-primary-fixed": "#271900", "background": "#faf8ff", "outline-variant": "#d1c5b4", "primary-fixed": "#ffdea7", "secondary-fixed-dim": "#e0c389", "primary": "#6f5214", "on-background": "#191b24", "surface-container-highest": "#e1e2ee", "on-error": "#ffffff", "surface-bright": "#faf8ff", "inverse-on-surface": "#eff0fd", "on-primary-fixed-variant": "#5d4203", "on-tertiary-fixed": "#00174b", "surface-variant": "#e1e2ee", "on-secondary-fixed": "#261a00", "on-surface": "#191b24", "surface-tint": "#78591c", "on-primary-container": "#fff2e0", "secondary-fixed": "#fddfa3", "surface": "#faf8ff", "on-secondary-fixed-variant": "#584416", "surface-container-high": "#e6e7f4", "secondary-container": "#fddfa3" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "space-xl": "2rem", "margin": "1rem", "gutter": "1rem" }, "fontFamily": { "body-lg": ["IBM Plex Sans Arabic"], "label-sm": ["IBM Plex Sans Arabic"], "label-lg": ["IBM Plex Sans Arabic"], "headline-xl": ["IBM Plex Sans Arabic"], "headline-lg": ["IBM Plex Sans Arabic"], "body-md": ["IBM Plex Sans Arabic"], "body-sm": ["IBM Plex Sans Arabic"], "numeric-fare": ["IBM Plex Sans Arabic"], "headline-md": ["IBM Plex Sans Arabic"], "label-md": ["IBM Plex Sans Arabic"], "headline-sm": ["IBM Plex Sans Arabic"] }, "fontSize": { "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "400" }], "label-sm": ["12px", { "lineHeight": "18px", "fontWeight": "500" }], "label-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-xl": ["32px", { "lineHeight": "44px", "fontWeight": "700" }], "headline-lg": ["26px", { "lineHeight": "36px", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }], "body-sm": ["13px", { "lineHeight": "20px", "fontWeight": "400" }], "numeric-fare": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "30px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-sm": ["18px", { "lineHeight": "26px", "fontWeight": "600" }] } } } }</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary"><main class="flex-1 flex flex-col relative w-full h-screen bg-surface"><div class="flex flex-col w-full relative select-none">
<!-- Map Canvas Viewport (Upper 40% contextual view) -->
<div class="relative w-full h-[320px] overflow-hidden bg-surface-container-high">
<!-- Static Rendered Base Map with Native Kurdish / Erbil Geography -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="Stylized ultra-clean GPS satellite view map of central Erbil Kurdistan, showing 60 Meter Road, Gulan Street, and Citadel ring layout in subtle daylight tones of sand, light grey, and cream with clean Arabic typography." data-location="Erbil, Kurdistan Region, Iraq" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDod3nVt0gxpls3dzRPvTWNghdrPqm5zmNNRtqdN8D0XYhb624d6_WJBBh9Heisk2osU-sztE3x8Dwm2rwiFAAWCvm1NcJrG2CKHhPJbQBFy6_Y07PdFSU-Yl9hgguXQM3PW-taO_dQ-O3KIydufFft2W9TkR0Aw_ITKDz29EJOrwbJXjBWzxGZ5stY_2WCCmB7kn2-4182sfsbTMXKGe27zhJ2Y9iBhrFKnkEU7GYj1X8LLHf1oTuK');"></div>
<!-- Active Route Geometry & Navigation Polyline Overlay -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-10" fill="none" viewbox="0 0 390 320" xmlns="http://www.w3.org/2000/svg">
<!-- Trajectory segment: Driver to Pickup (Dotted High-Vis line) -->
<path d="M 64 260 C 80 230, 95 190, 130 160" opacity="0.8" stroke="#004cca" stroke-dasharray="6 6" stroke-linecap="round" stroke-width="4"></path>
<!-- Trajectory segment: Pickup to Erbil International Airport Dropoff (Bold solid 6px navigation corridor) -->
<path d="M 130 160 C 175 130, 220 115, 260 85 C 290 60, 315 45, 335 38" stroke="#004cca" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"></path>
</svg>
<!-- Map Marker: Driver Position (Golden Ambient Pulse) -->
<div class="absolute left-[52px] top-[248px] z-20 flex items-center justify-center -translate-x-1/2 -translate-y-1/2">
<div class="w-10 h-10 rounded-full bg-primary/20 animate-ping absolute"></div>
<div class="w-8 h-8 rounded-full bg-inverse-surface shadow-md flex items-center justify-center text-primary-fixed">
<span class="material-symbols-outlined text-[18px]">navigation</span>
</div>
</div>
<!-- Map Marker: Pickup Location (Ink circle with passenger glyph) -->
<div class="absolute left-[130px] top-[160px] z-20 flex flex-col items-center -translate-x-1/2 -translate-y-full">
<div class="bg-inverse-surface text-surface-container-lowest px-2 py-0.5 rounded-full text-[11px] font-label-sm shadow-md mb-1 whitespace-nowrap">
        فاميلي مول
      </div>
<div class="w-7 h-7 rounded-full bg-inverse-surface flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-[16px] text-surface-container-lowest">person</span>
</div>
</div>
<!-- Map Marker: Destination Point (Gold square with dark destination flag) -->
<div class="absolute left-[335px] top-[38px] z-20 flex flex-col items-center -translate-x-1/2 -translate-y-full">
<div class="bg-primary-container text-on-primary-container px-2 py-0.5 rounded-full text-[11px] font-label-sm shadow-md mb-1 whitespace-nowrap">
        مطار أربيل
      </div>
<div class="w-7 h-7 rounded-lg bg-primary-fixed flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-[18px] text-on-primary-fixed" style="font-variation-settings: 'FILL' 1;">flag</span>
</div>
</div>
<!-- Floating HUD Map Utilities (Ergonomic arm's reach) -->
<div class="absolute left-4 top-4 z-30 flex flex-col gap-2">
<button aria-label="إعادة التمركز" class="w-11 h-11 rounded-full bg-surface-container-lowest shadow-lg flex items-center justify-center text-on-surface active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[22px]">my_location</span>
</button>
<button aria-label="رؤية المسار كاملاً" class="w-11 h-11 rounded-full bg-surface-container-lowest shadow-lg flex items-center justify-center text-on-surface active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[22px]">polyline</span>
</button>
</div>
</div>
<!-- Primary Bottom Sheet: Incoming Trip Offer Commitment Module -->
<div class="relative w-full bg-surface-container-lowest rounded-t-[24px] shadow-2xl flex flex-col -mt-4 z-30 pb-safe">
<!-- Top Header Banner: Ink Obsidian with Integrated Countdown -->
<div class="w-full bg-inverse-surface rounded-t-[24px] px-4 py-3 flex items-center justify-between text-surface-container-lowest">
<!-- Right Side (RTL Start): Trip Category & Title -->
<div class="flex items-center gap-3">
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-surface-container-lowest font-bold">رحلة جديدة</span>
<span class="font-label-sm text-label-sm text-surface-dim">طلب فوري متاح</span>
</div>
<div class="bg-surface-variant/30 text-primary-fixed-dim px-3 py-1 rounded-full font-label-sm text-label-sm font-semibold">
          اقتصادي
        </div>
</div>
<!-- Left Side (RTL End): 15-Second Circular Progress Ring -->
<div class="relative w-12 h-12 flex items-center justify-center">
<svg class="w-12 h-12 -rotate-90" viewbox="0 0 48 48">
<circle cx="24" cy="24" fill="none" r="20" stroke="#3e404c" stroke-width="3"></circle>
<circle class="transition-all duration-1000 ease-linear" cx="24" cy="24" fill="none" id="countdown-ring" r="20" stroke="#e9c179" stroke-dasharray="125.6" stroke-dashoffset="25.1" stroke-linecap="round" stroke-width="3.5"></circle>
</svg>
<span class="absolute font-numeric-fare text-[18px] font-bold text-primary-fixed-dim leading-none pt-0.5" id="countdown-val">12</span>
</div>
</div>
<!-- Bottom Sheet Content Envelope -->
<div class="px-5 pt-4 pb-2 flex flex-col gap-4">
<!-- Fare Valuation Banner & Payment Classification -->
<div class="flex items-center justify-between bg-surface-container-low px-4 py-3 rounded-2xl">
<div class="flex items-baseline gap-1.5">
<span class="font-numeric-fare text-numeric-fare text-on-surface tracking-tight font-bold">6,000</span>
<span class="font-label-lg text-label-lg text-secondary font-semibold">د.ع</span>
</div>
<div class="flex items-center gap-1.5 bg-secondary-container text-on-secondary-container px-3 py-1.5 rounded-full">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-md text-label-md font-semibold">نقداً</span>
</div>
</div>
<!-- Route Trajectory Details (Stacked Stepper) -->
<div class="flex flex-col gap-3 relative px-1">
<!-- Connecting Vertical Route Filament -->
<div class="absolute right-[19px] top-[28px] bottom-[28px] w-0.5 bg-surface-variant pointer-events-none"></div>
<!-- Pickup Stop Block -->
<div class="flex items-start gap-3 relative z-10">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0 mt-0.5 shadow-sm">
<div class="w-3.5 h-3.5 rounded-full bg-inverse-surface"></div>
</div>
<div class="flex flex-col min-w-0 flex-1">
<div class="flex items-center gap-1.5">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold truncate">يبعد 4 دقائق · 1.2 كم</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant truncate">شارع 60، قرب فاميلي مول</span>
</div>
</div>
<!-- Drop-off Destination Block -->
<div class="flex items-start gap-3 relative z-10">
<div class="w-8 h-8 rounded-lg bg-primary-fixed flex items-center justify-center flex-shrink-0 mt-0.5 shadow-sm">
<span class="material-symbols-outlined text-[18px] text-on-primary-fixed" style="font-variation-settings: 'FILL' 1;">flag</span>
</div>
<div class="flex flex-col min-w-0 flex-1">
<div class="flex items-center gap-1.5">
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold truncate">الرحلة 18 دقيقة · 9.4 كم</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant truncate">مطار أربيل الدولي</span>
</div>
</div>
</div>
<!-- Trip Modifier Badges -->
<div class="flex items-center gap-2 pt-1">
<div class="flex items-center gap-1 bg-surface-container px-3 py-1 rounded-full text-on-surface-variant font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[15px]">trip_origin</span>
<span>محطة واحدة</span>
</div>
<div class="flex items-center gap-1 bg-surface-container px-3 py-1 rounded-full text-on-surface-variant font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[15px]">group</span>
<span>لشخص آخر</span>
</div>
</div>
<!-- Tactical Commitment Action Buttons -->
<div class="flex flex-col gap-2 pt-2">
<!-- Accept Button (Hero Full-width 64px) -->
<button class="w-full h-16 rounded-2xl bg-primary-fixed text-on-primary-fixed font-headline-sm text-headline-sm font-bold shadow-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform" id="accept-btn" type="button">
<span>قبول</span>
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
<!-- Decline Action (Subtle Text target, 48px min touch area) -->
<button class="w-full h-12 flex items-center justify-center text-on-surface-variant font-label-lg text-label-lg hover:text-error active:opacity-60 transition-colors" id="decline-btn" type="button">
          رفض
        </button>
</div>
</div>
</div>
</div>
<script>
  (function () {
    let timeLeft = 12;
    const totalTime = 15;
    const fullDash = 125.6;
    const ring = document.getElementById('countdown-ring');
    const valText = document.getElementById('countdown-val');

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft >= 0) {
        valText.textContent = timeLeft;
        const progress = timeLeft / totalTime;
        ring.style.strokeDashoffset = (fullDash * (1 - progress)).toString();
      } else {
        clearInterval(timer);
        const declineBtn = document.getElementById('decline-btn');
        if (declineBtn) declineBtn.click();
      }
    }, 1000);

    const acceptBtn = document.getElementById('accept-btn');
    if (acceptBtn) {
      acceptBtn.addEventListener('click', () => {
        clearInterval(timer);
        acceptBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[24px]">progress_activity</span>';
      });
    }
  })();
</script></main></body></html>
