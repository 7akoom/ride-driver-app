<!-- Map Ambience Gradient Vignette -->

<!-- Floating Top Bar Overlay: Turn Guidance & Emergency SOS -->

</div>
<div class="flex flex-col min-w-0">

</div>
<p class="font-body-sm text-body-sm text-on-surface-variant truncate">استمر باتجاه نفق تقاطع عينكاوة</p>
</div>
</div>
<!-- High-Priority Red Circular SOS Button -->
<button aria-label="طوارئ" class="w-13 h-13 min-w-[52px] min-h-[52px] rounded-full bg-error text-on-error shadow-lg flex items-center justify-center shrink-0 active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">sos</span>
</button>
</div>
<!-- Quick Floating Map Controls -->
<div class="absolute bottom-6 left-4 flex flex-col gap-2 z-10">
<button aria-label="إعادة التوسيط" class="w-11 h-11 bg-surface-container-lowest text-on-surface rounded-full shadow-md flex items-center justify-center active:bg-surface-container" type="button">
<span class="material-symbols-outlined text-[22px]">my_location</span>
</button>
<button aria-label="طبقات الخريطة" class="w-11 h-11 bg-surface-container-lowest text-on-surface rounded-full shadow-md flex items-center justify-center active:bg-surface-container" type="button">
<span class="material-symbols-outlined text-[22px]">traffic</span>
</button>

<!-- Speed Telemetry Chip -->
<div class="absolute bottom-6 right-4 z-10 bg-surface-container-lowest/90 backdrop-blur-md px-3 py-1.5 rounded-full shadow-sm flex items-center gap-1.5 text-on-surface">
<span class="font-headline-sm text-headline-sm text-primary">64</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">كم/س</span>
</div>

<!-- Docked HUD / Bottom Navigation Command Station -->
<div class="relative w-full bg-surface-container-lowest rounded-t-[28px] shadow-2xl px-4 pt-3 pb-6 flex flex-col gap-3 -mt-4 z-20">
<!-- Tactile Drag Handle -->
<div class="w-10 h-1 bg-surface-variant rounded-full mx-auto mb-1"></div>
<!-- Current Trip Progress & Rider Overview -->
<div class="bg-surface-container-low rounded-2xl p-3.5 flex flex-col gap-3">
<!-- Destination ETA & Distance -->
<div class="flex items-center justify-between">
<div class="flex flex-col">
<div class="flex items-baseline gap-1.5">

<div class="flex items-center gap-1.5 mt-0.5">

<!-- Ambient Golden Glow -->

<div class="relative flex items-center justify-between gap-3">
<!-- Trip Stack Icon Pill -->
<div class="w-11 h-11 rounded-xl bg-primary-container text-on-primary-container flex items-center justify-center shrink-0 shadow-sm">

<!-- Queued Trip Details Content -->
<div class="flex-1 min-w-0 flex flex-col">
<div class="flex items-center gap-1.5">

</div>

<!-- Slide to Confirm Bar: End Current Trip (RTL Ergonomics: Drag Right to Left) -->
<div class="relative w-full h-16 bg-surface-container rounded-full overflow-hidden flex items-center p-1.5 touch-none select-none shadow-inner" id="slide-track">
<!-- Background Prompt Arabic Text -->
<div class="w-full text-center font-label-lg text-label-lg text-on-surface-variant font-semibold tracking-wide pointer-events-none pr-8">
        اسحب لإنهاء الرحلة
      </div>
<!-- Sliding Handle Knob (Anchored on the Right for RTL Swipe) -->
<div class="absolute right-1.5 top-1.5 bottom-1.5 w-[54px] rounded-full bg-on-background text-primary-fixed shadow-lg flex items-center justify-center cursor-grab active:cursor-grabbing transition-shadow" id="slide-knob">
<span class="material-symbols-outlined text-[26px]">chevron_left</span>
</div>
</div>
</div>
</div>
<script>
  (function () {
    const track = document.getElementById('slide-track');
    const knob = document.getElementById('slide-knob');
    if (!track || !knob) return;

    let isDragging = false;
    let startX = 0;
    let currentTranslate = 0;
    let maxTranslate = 0;

    function getPositionX(e) {
      return e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
    }

    function onStart(e) {
      isDragging = true;
      startX = getPositionX(e);
      maxTranslate = track.clientWidth - knob.clientWidth - 12;
      knob.style.transition = 'none';
    }

    function onMove(e) {
      if (!isDragging) return;
      const currentX = getPositionX(e);
      // In RTL layout, dragging leftwards means decreasing X (negative delta)
      const delta = startX - currentX;
      if (delta >= 0 && delta <= maxTranslate) {
        currentTranslate = delta;
        knob.style.transform = `translateX(-${delta}px)`;
      } else if (delta < 0) {
        currentTranslate = 0;
        knob.style.transform = 'translateX(0px)';
      }
    }

    function onEnd() {
      if (!isDragging) return;
      isDragging = false;
      knob.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)';

      // Threshold: 80% of track length completed
      if (currentTranslate >= maxTranslate * 0.8) {
        knob.style.transform = `translateX(-${maxTranslate}px)`;
        knob.classList.add('bg-primary');
        setTimeout(() => {
          // Soft feedback simulation
          knob.style.transform = 'translateX(0px)';
          knob.classList.remove('bg-primary');
        }, 1200);
      } else {
        knob.style.transform = 'translateX(0px)';
      }
      currentTranslate = 0;
    }

    knob.addEventListener('touchstart', onStart, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('touchend', onEnd);

    knob.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
  })();
</script></main></body></html>
