name: driver_app
description: Ride Platform — Captain (driver) app (Flutter)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  maplibre_gl: ^0.27.1
  dio: ^5.5.0
  crypto: ^3.0.3
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  # Push notifications (trip offers ring even with the app closed).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # The phone's GPS. The range lets pub pick the newest version that works with the
  # installed Flutter (version 14 needs Flutter 3.29 or newer).
  geolocator: ">=12.0.0 <15.0.0"
  # Spoken turn-by-turn directions with the phone's own speech engine.
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
